<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ======================================================================
       QUAN TRỌNG: THAY CẢ DÒNG NÀY BẰNG KHỐI <script>...</script> CHỨA THƯ VIỆN jsQR
       TRONG FILE CŨ CỦA BẠN (khối bắt đầu bằng "(function webpackUniversalModuleDefinition"
       và kết thúc bằng "</script>" ngay trước thẻ <style>). Giữ nguyên, không sửa gì.
       ====================================================================== -->
  <script>/* DÁN LẠI KHỐI jsQR Ở ĐÂY */</script>

  <style>
    * { box-sizing:border-box; }
    body {
      font-family: Arial, sans-serif;
      background:#111;
      color:#fff;
      margin:0;
      padding:12px;
    }
    .wrap { max-width:480px; margin:0 auto; }
    .top {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:10px;
    }
    .top h1 { font-size:18px; margin:0; }
    .counter {
      background:#1a73e8; border-radius:20px; padding:6px 14px;
      font-weight:bold; font-size:15px;
    }
    .cam {
      position:relative; width:100%; aspect-ratio:1/1;
      background:#000; border-radius:16px; overflow:hidden;
    }
    video { width:100%; height:100%; object-fit:cover; pointer-events:none; }
    video::-webkit-media-controls,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-enclosure {
      display:none !important; -webkit-appearance:none; opacity:0;
    }
    .frame {
      position:absolute; inset:18%;
      border:3px solid rgba(255,255,255,.8); border-radius:14px;
      pointer-events:none;
    }
    #startBox {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:#000; padding:20px;
      text-align:center; gap:14px;
    }
    button {
      border:0; border-radius:12px; background:#1a73e8; color:#fff;
      font-size:18px; padding:16px 28px; cursor:pointer;
    }
    #startErr { color:#ff8a80; font-size:14px; }
    #overlay {
      position:absolute; inset:0; display:none; flex-direction:column;
      align-items:center; justify-content:center; text-align:center;
      padding:16px;
    }
    #overlay.ok   { background:rgba(24,128,56,.96); }
    #overlay.warn { background:rgba(227,160,8,.96); }
    #overlay.err  { background:rgba(217,48,37,.96); }
    #overlay.load { background:rgba(40,40,40,.92); }
    #pendingBar, #notice {
      position:absolute; left:50%; transform:translateX(-50%); display:none; z-index:5;
      padding:8px 14px; border-radius:20px; font-size:14px; font-weight:bold;
      pointer-events:none; max-width:90%; text-align:center;
    }
    /* Thông báo "Đang ghi nhận..." nằm CHÍNH GIỮA camera */
    #pendingBar {
      top:50%; bottom:auto; transform:translate(-50%,-50%);
      font-size:18px; padding:14px 22px; border-radius:16px;
      background:rgba(26,115,232,.95); color:#fff;
      box-shadow:0 4px 18px rgba(0,0,0,.45);
    }
    #notice { top:12px; background:rgba(251,188,4,.95); color:#111; }
    .time { font-size:15px; margin-top:12px; opacity:.97; line-height:1.5; }
    .hint { display:none; }   /* kết quả tự ẩn sau 1 giây nên không cần dòng nhắc chạm màn hình */
    #overlay { cursor:pointer; }
    .icon { font-size:64px; line-height:1; }
    .name { font-size:26px; font-weight:bold; margin-top:10px; }
    .meta { font-size:16px; margin-top:6px; opacity:.95; }
    .msg  { font-size:16px; margin-top:12px; font-weight:bold; }
    .last {
      margin-top:12px; border-radius:14px; padding:14px 16px;
      background:#1d1d1d; border-left:8px solid #555; text-align:left;
    }
    .last.ok   { border-left-color:#34a853; background:#12261a; }
    .last.warn { border-left-color:#fbbc04; background:#2b2410; }
    .last.err  { border-left-color:#ea4335; background:#2b1412; }
    .last .l-title { font-size:12px; color:#aaa; letter-spacing:.5px; }
    .last .l-name  { font-size:22px; font-weight:bold; margin:4px 0; }
    .last .l-info  { font-size:15px; color:#ddd; }
    .last .l-status { font-size:15px; font-weight:bold; margin-top:8px; }
    .last.ok .l-status   { color:#81c995; }
    .last.warn .l-status { color:#fdd663; }
    .last.err .l-status  { color:#f28b82; }
    h3 { font-size:14px; margin:16px 0 6px; color:#aaa; }
    #history { list-style:none; margin:0; padding:0; }
    #history li {
      display:flex; justify-content:space-between; gap:8px;
      background:#1d1d1d; border-radius:8px; padding:8px 10px;
      margin-bottom:5px; font-size:14px;
    }
    .t-load { color:#aaa; } .t-ok { color:#81c995; } .t-warn { color:#fdd663; } .t-err { color:#f28b82; }

    /* ----- Đăng nhập ----- */
    #loginBox {
      position:fixed; inset:0; background:#111; display:none;
      align-items:center; justify-content:center; padding:20px; z-index:50;
    }
    .lcard { width:100%; max-width:360px; background:#1d1d1d; border-radius:16px; padding:24px; }
    .lcard h2 { margin:0 0 4px; font-size:20px; }
    .lcard p { margin:0 0 16px; color:#aaa; font-size:13px; }
    .lcard input {
      width:100%; padding:14px; margin-bottom:12px; border-radius:10px;
      border:1px solid #444; background:#111; color:#fff; font-size:16px;
    }
    .lcard button { width:100%; }
    #loginErr { color:#ff8a80; font-size:14px; min-height:20px; margin-top:10px; text-align:center; }
    .userbar { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#aaa; margin-bottom:8px; }
    .userbar button { background:#333; font-size:13px; padding:6px 12px; border-radius:8px; }
  </style>
</head>
<body>
<div id="loginBox">
  <div class="lcard">
    <h2>🍚 Đăng nhập</h2>
    <p>Đăng nhập để sử dụng trang quét suất ăn.</p>
    <input id="lUser" type="text" placeholder="Tài khoản" autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="lPass" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button id="lBtn" onclick="doLogin()">ĐĂNG NHẬP</button>
    <div id="loginErr"></div>
  </div>
</div>

<div class="wrap">
  <div class="userbar"><span id="userName"></span><button onclick="doLogout()">Đăng xuất</button></div>

  <div class="top">
    <h1>🍚 QUÉT SUẤT ĂN</h1>
    <div class="counter">Đã nhận: <span id="count">0</span></div>
  </div>

  <div class="cam">
    <video id="video" autoplay playsinline webkit-playsinline muted disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback"></video>
    <div class="frame"></div>

    <div id="startBox">
      <div>Đưa mã QR của nhân viên vào khung để ghi nhận. Quét xong sẽ tự động quét tiếp.</div>
      <button id="startBtn" onclick="startScan()">▶ BẮT ĐẦU QUÉT</button>
      <div id="startErr"></div>
    </div>

    <div id="notice"></div>
    <div id="pendingBar"></div>

    <div id="overlay">
      <div class="icon" id="oIcon"></div>
      <div class="name" id="oName"></div>
      <div class="meta" id="oMeta"></div>
      <div class="msg" id="oMsg"></div>
      <div class="time" id="oTime"></div>
      <div class="hint" id="oHint">Chạm màn hình để quét tiếp</div>
    </div>
  </div>

  <div id="last" class="last">
    <div class="l-title">NGƯỜI VỪA QUÉT</div>
    <div class="l-name" id="lName">Chưa có ai quét</div>
    <div class="l-info" id="lInfo"></div>
    <div class="l-status" id="lStatus"></div>
  </div>

  <h3>LỊCH SỬ QUÉT GẦN ĐÂY</h3>
  <ul id="history"></ul>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
// ===== DÁN URL WEB APP (kết thúc bằng /exec) VÀO ĐÂY =====
const API_URL = 'https://script.google.com/macros/s/AKfycbxuXs5l3KxHqTJGdesk_CBjGrzlQC-4jZk5rVgXbP7czTCX0KoDuIy3tb9ceKMi2mOk/exec';
// ==========================================================

// Bật = true nếu muốn máy đọc thành tiếng "Trùng suất ăn" / "Không có nhân viên"
// (không phải điện thoại nào cũng có giọng tiếng Việt, nên mặc định tắt)
const VOICE_ENABLED = false;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let scanning = false;
let busy = false;
let lastCode = '';
let lastTime = 0;
let okCount = 0;
let lastTick = 0;
let audioCtx = null;
let camListenersAdded = false;

const SAME_CODE_COOLDOWN = 4000; // ms: bỏ qua cùng 1 mã quét lặp lại liên tục

// ---------- Đăng nhập ----------
const AUTH_KEY = 'scan_auth';

function loadAuth() {
  try {
    const a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
    if (a && a.token && a.exp > Date.now()) return a;
  } catch (e) {}
  return null;
}

// Dừng camera và đưa trang về trạng thái chờ
function stopScan() {
  scanning = false;
  busy = false;
  clearTimeout(holdTimer);
  blockedCode = '';
  try {
    const st = video.srcObject;
    if (st) st.getTracks().forEach(function (t) { t.stop(); });
    video.srcObject = null;
  } catch (e) {}
  document.getElementById('startBox').style.display = 'flex';
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('pendingBar').style.display = 'none';
}

function applyAuth() {
  const a = loadAuth();
  const box = document.getElementById('loginBox');
  if (a) {
    box.style.display = 'none';
    document.getElementById('userName').textContent = '👤 ' + (a.name || a.user);
  } else {
    stopScan();
    document.getElementById('userName').textContent = '';
    document.getElementById('lPass').value = '';
    box.style.display = 'flex';
  }
}

function doLogin() {
  const u = document.getElementById('lUser').value.trim();
  const p = document.getElementById('lPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('lBtn');
  err.textContent = '';
  if (!u || !p) { err.textContent = 'Vui lòng nhập tài khoản và mật khẩu.'; return; }
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // tránh preflight CORS với Apps Script
    body: JSON.stringify({ action: 'login', username: u, password: p })
  })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.ok) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({
          token: res.token, user: res.user, name: res.hoTen,
          exp: Date.now() + (res.expiresIn || 21600) * 1000 - 60000
        }));
        applyAuth();
      } else {
        err.textContent = (res && res.message) || 'Đăng nhập không thành công.';
      }
    })
    .catch(function (e) { err.textContent = 'Lỗi kết nối: ' + (e && e.message ? e.message : e); })
    .finally(function () { btn.disabled = false; btn.textContent = 'ĐĂNG NHẬP'; });
}

function doLogout() {
  const a = loadAuth();
  localStorage.removeItem(AUTH_KEY);
  if (a) {
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'logout', token: a.token }) }).catch(function () {});
  }
  applyAuth();
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && document.getElementById('loginBox').style.display !== 'none') doLogin();
});

// ---------- Camera ----------
async function startScan() {
  const err = document.getElementById('startErr');
  err.textContent = '';
  try {
    // Tạo âm thanh (cần thao tác bấm nút của người dùng)
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.srcObject = stream;
    await video.play();

    // iOS hay tự tạm dừng video -> tự phát lại
    if (!camListenersAdded) {
      camListenersAdded = true;
      video.addEventListener('pause', function () {
        if (scanning) video.play().catch(function () {});
      });
      document.querySelector('.cam').addEventListener('click', function () {
        if (video.paused) video.play().catch(function () {});
      });
    }

    // Lấy nét liên tục (nếu thiết bị hỗ trợ)
    try {
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    } catch (e) {}

    // Giữ màn hình luôn sáng
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}

    document.getElementById('startBox').style.display = 'none';
    scanning = true;
    requestAnimationFrame(tick);
  } catch (e) {
    err.textContent = 'Không mở được camera: ' + (e && e.message ? e.message : e) +
      '. Hãy cho phép quyền camera cho trình duyệt, hoặc mở link này trực tiếp bằng Chrome.';
  }
}

function tick(ts) {
  if (!scanning) return;
  requestAnimationFrame(tick);

  if (video.paused) video.play().catch(function () {});
  if (busy || ts - lastTick < 120) return; // quét ~8 lần/giây
  lastTick = ts;
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

  // Cắt vùng vuông ở giữa khung hình, giữ độ phân giải cao để đọc mã QR dày
  const vw = video.videoWidth, vh = video.videoHeight;
  const side = Math.floor(Math.min(vw, vh) * 0.85);
  const sx = Math.floor((vw - side) / 2), sy = Math.floor((vh - side) / 2);
  const out = Math.min(side, 900);
  canvas.width = out; canvas.height = out;
  ctx.drawImage(video, sx, sy, side, side, 0, 0, out, out);

  const img = ctx.getImageData(0, 0, out, out);
  const code = jsQR(img.data, out, out, { inversionAttempts: 'dontInvert' });
  const nowMs = Date.now();
  if (code && code.data) {
    const m = extractMsnv(code.data);
    if (blockedCode && m === blockedCode) { blockedSeen = nowMs; return; } // thẻ vừa quét vẫn còn trước camera
    handleCode(code.data);
  } else if (blockedCode && nowMs - blockedSeen > 800) {
    blockedCode = ''; // thẻ đã rời khỏi khung hình -> sẵn sàng quét thẻ kế tiếp
  }
}

// ---------- Xử lý mã QR ----------
function extractMsnv(text) {
  text = String(text || '').trim();
  try {
    const m = new URL(text).searchParams.get('msnv');
    if (m) return m.trim();
  } catch (e) {}
  // Nếu QR chỉ chứa MSNV thuần
  return /^[\w\-.]{1,30}$/.test(text) ? text : '';
}

// Giờ Việt Nam (dd/MM/yyyy HH:mm:ss) bất kể múi giờ của điện thoại
function vnDateTime() {
  return new Date().toLocaleString('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false }).replace(',', '');
}
function vnTime() {
  return new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false });
}

// ===== QUÉT TỪNG THẺ MỘT =====
// Quét 1 thẻ -> khóa camera -> chờ máy chủ -> hiện màn hình kết quả đủ lâu -> mới quét thẻ kế tiếp
// Sau khi trả kết quả, màn hình kết quả hiện trong khoảng thời gian dưới đây rồi TỰ quay lại camera để quét thẻ kế tiếp
// (có thể chạm vào màn hình để quay lại sớm hơn). Đơn vị: mili-giây (1000 = 1 giây)
const RESULT_HOLD_MS = { ok: 1000, warn: 1000, err: 1000 };   // 1000 = 1 giây, tự ẩn, nhân viên không cần bấm

const pending = {};          // MSNV đang chờ máy chủ trả lời (tối đa 1)
let blockedCode = '';        // thẻ vừa xử lý: phải rời khỏi khung hình rồi mới quét lại được
let blockedSeen = 0;
let holdTimer = null;
let currentMsnv = '';

// Thanh nhỏ ở đáy camera khi đang chờ máy chủ (camera vẫn hiển thị)
function updatePending() {
  const n = Object.keys(pending).length;
  const el = document.getElementById('pendingBar');
  if (n > 0) { el.textContent = '⏳ Đang ghi nhận ' + currentMsnv + '...'; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

// Thông báo nhỏ ở đầu camera (không che hình)
let noticeTimer = null;
function notice(text, ms) {
  const el = document.getElementById('notice');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(function () { el.style.display = 'none'; }, ms);
}

// Hiện màn hình kết quả và giữ ms mili-giây (hoặc chạm vào màn hình để quét tiếp ngay)
function holdResult(type, icon, name, meta, msg, timeText, ms) {
  showOverlay(type, icon, name, meta, msg, timeText);
  clearTimeout(holdTimer);
  holdTimer = setTimeout(endHold, ms);   // hết thời gian -> tự hiện lại camera để quét tiếp
}

function endHold() {
  clearTimeout(holdTimer);
  document.getElementById('overlay').style.display = 'none';
  blockedCode = currentMsnv;       // chờ thẻ này rời khung hình rồi mới nhận thẻ kế tiếp
  blockedSeen = Date.now();
  busy = false;                    // mở khóa -> quay lại màn hình quét
}
document.getElementById('overlay').addEventListener('click', endHold);

function handleCode(text) {
  const msnv = extractMsnv(text);
  if (!msnv) {
    const t = Date.now();
    if (text === lastCode && t - lastTime < SAME_CODE_COOLDOWN) return;
    lastCode = text; lastTime = t;
    notice('⚠ Không phải mã suất ăn của công ty', 2000);
    return;
  }
  if (busy) return;

  const cur = loadAuth();          // chưa đăng nhập / hết phiên -> yêu cầu đăng nhập lại
  if (!cur) { applyAuth(); return; }

  busy = true;                     // KHÓA: chỉ xử lý một thẻ tại một thời điểm
  currentMsnv = msnv;
  beepScan();

  const li = addHistory('load', msnv, msnv, '');
  pending[msnv] = true;
  updatePending();
  const started = Date.now();

  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, 25000);

  // _ = Date.now() và cache:'no-store' để trình duyệt KHÔNG dùng lại kết quả cũ
  fetch(API_URL + '?action=record&msnv=' + encodeURIComponent(msnv) +
        '&token=' + encodeURIComponent(cur.token) + '&_=' + Date.now(),
        { signal: ctrl.signal, cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      clearTimeout(timer); delete pending[msnv]; updatePending();
      onResult(msnv, res, li, Date.now() - started);
    })
    .catch(function (err) {
      clearTimeout(timer); delete pending[msnv]; updatePending();
      onResult(msnv, { ok: false, message: 'Lỗi kết nối: ' + (err && err.message ? err.message : err) },
        li, Date.now() - started);
    });
}

function onResult(msnv, res, li, ms) {
  // Hết phiên đăng nhập -> quay về màn hình đăng nhập
  if (res && res.auth === false) {
    localStorage.removeItem(AUTH_KEY);
    updateHistory(li, 'err', msnv, msnv, '', ms);
    applyAuth();
    document.getElementById('loginErr').textContent = res.message || 'Hết phiên đăng nhập.';
    return;
  }

  const emp = res.employee;
  const name = emp ? emp.hoTen : msnv;
  const meta = emp ? (emp.msnv + ' • ' + emp.donVi) : '';
  let type, icon, msg, timeText;

  if (res.ok) {
    type = 'ok'; icon = '✓'; msg = res.message;
    timeText = '🕒 Thời gian: ' + res.time;               // đúng bằng giờ đã ghi trong sheet LICH_SU_AN
    okCount++;
    document.getElementById('count').textContent = okCount;
    beep('ok');
  } else if (res.duplicate) {
    type = 'warn'; icon = '⚠'; msg = res.message;
    timeText = '🕒 Quét lúc: ' + vnDateTime() + '\nĐã nhận lúc: ' + res.time +
      (res.next ? '\nQuét lại được sau: ' + res.next : '');
    beep('dup');                                    // TRÙNG: 3 tiếng bíp
  } else {
    type = 'err'; icon = '✕'; msg = res.message;
    timeText = '🕒 Thời gian: ' + vnDateTime();
    beep(res.notFound ? 'notfound' : 'err');        // CHƯA TẠO NHÂN VIÊN: bzzzt trầm; lỗi khác: 2 tiếng ngắn
  }

  holdResult(type, icon, name, meta, msg, timeText, RESULT_HOLD_MS[type]);
  setLast(type, icon, name, emp, msnv, msg);
  updateHistory(li, type, name, msnv, emp ? emp.donVi : '', ms);
}

// Gọi nhẹ lên máy chủ định kỳ để Apps Script không bị "nguội" (khởi động lại rất chậm)
function ping() { fetch(API_URL + '?action=ping&_=' + Date.now(), { cache: 'no-store' }).catch(function () {}); }
ping();
setInterval(ping, 4 * 60 * 1000);

// ---------- Giao diện ----------
function showOverlay(type, icon, name, meta, msg, timeText) {
  const o = document.getElementById('overlay');
  o.className = type;
  o.style.display = 'flex';
  document.getElementById('oIcon').textContent = icon;
  document.getElementById('oName').textContent = name;
  document.getElementById('oMeta').textContent = meta;
  document.getElementById('oMsg').textContent = msg;
  const t = document.getElementById('oTime');
  t.textContent = timeText || '';
  t.style.whiteSpace = 'pre-line';   // cho phép xuống dòng trong dòng thời gian
}

// Khung cố định: giữ thông tin người vừa quét cho đến khi có người kế tiếp
function setLast(type, icon, name, emp, msnv, text) {
  const box = document.getElementById('last');
  box.className = 'last ' + type;
  document.getElementById('lName').textContent = name;
  document.getElementById('lInfo').textContent = emp
    ? 'MSNV: ' + emp.msnv + '  •  Đơn vị: ' + emp.donVi + '  •  Quét lúc ' + vnDateTime()
    : 'MSNV: ' + msnv + '  •  Quét lúc ' + vnDateTime();
  document.getElementById('lStatus').textContent = icon + ' ' + text;
}

function addHistory(type, name, msnv, unit) {
  const li = document.createElement('li');
  li.innerHTML = '<span></span><span></span>';
  const ul = document.getElementById('history');
  ul.insertBefore(li, ul.firstChild);
  while (ul.children.length > 8) ul.removeChild(ul.lastChild);
  fillHistory(li, type, name, msnv, unit, null);
  return li;
}

function updateHistory(li, type, name, msnv, unit, ms) {
  fillHistory(li, type, name, msnv, unit, ms);
}

function fillHistory(li, type, name, msnv, unit, ms) {
  const time = li.dataset.time || (li.dataset.time = vnTime());
  const labels = { load: '⏳ Đang ghi nhận...', ok: '✓ Đã ghi nhận', warn: '⚠ Trùng', err: '✕ Lỗi' };
  li.children[0].textContent = name + ' (' + msnv + (unit ? ' - ' + unit : '') + ') • ' + time;
  li.children[1].textContent = labels[type] + (ms != null ? ' (' + (ms / 1000).toFixed(1) + 's)' : '');
  li.children[1].className = 't-' + type;
}

// Tiếng "tít" ngắn ngay khi đọc được mã (chưa cần chờ máy chủ)
function beepScan() {
  try {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 1400;
    gain.gain.value = 0.12;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
  } catch (e) {}
}

// Phát một chuỗi nốt: {f: tần số Hz, t: thời điểm bắt đầu (giây), d: độ dài (giây), type: kiểu sóng, v: âm lượng}
function playTones(seq) {
  try {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    seq.forEach(function (s) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = s.type || 'sine';
      osc.frequency.value = s.f;
      gain.gain.value = s.v || 0.25;
      osc.connect(gain); gain.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + s.t;
      osc.start(t0);
      osc.stop(t0 + s.d);
    });
  } catch (e) {}
}

// kind: 'ok' hợp lệ | 'dup' trùng | 'notfound' chưa tạo nhân viên | 'err' lỗi khác
function beep(kind) {
  try {
    if (navigator.vibrate) {
      navigator.vibrate({ ok: 80, dup: [150, 80, 150], notfound: [600], err: [120, 60, 120] }[kind] || 100);
    }
  } catch (e) {}

  if (kind === 'ok') {
    // HỢP LỆ: "ding-ding" cao, đi lên, nghe vui tai
    playTones([{ f: 880, t: 0, d: 0.10 }, { f: 1320, t: 0.12, d: 0.18 }]);
  } else if (kind === 'dup') {
    // TRÙNG: 3 tiếng "bíp" vừa, ngắt quãng
    playTones([
      { f: 600, t: 0,    d: 0.12, type: 'square', v: 0.15 },
      { f: 600, t: 0.20, d: 0.12, type: 'square', v: 0.15 },
      { f: 600, t: 0.40, d: 0.12, type: 'square', v: 0.15 }
    ]);
  } else if (kind === 'notfound') {
    // CHƯA TẠO NHÂN VIÊN: một tiếng "bzzzt" trầm, dài
    playTones([{ f: 160, t: 0, d: 0.8, type: 'sawtooth', v: 0.3 }]);
  } else {
    // Lỗi khác (mất mạng, hệ thống bận...)
    playTones([{ f: 330, t: 0, d: 0.12 }, { f: 330, t: 0.18, d: 0.12 }]);
  }

  // Đọc thành tiếng (tùy chọn, bật bằng VOICE_ENABLED ở đầu script)
  try {
    const say = { dup: 'Trùng suất ăn', notfound: 'Không có nhân viên' }[kind];
    if (VOICE_ENABLED && say && window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(say);
      u.lang = 'vi-VN';
      speechSynthesis.speak(u);
    }
  } catch (e) {}
}

// Mở trang: chưa đăng nhập thì hiện màn hình đăng nhập
applyAuth();
