<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#f4f6f8;
      margin:0;
      padding:20px;
      color:#222;
    }
    .card {
      max-width:430px;
      margin:30px auto;
      background:white;
      padding:25px;
      border-radius:16px;
      box-shadow:0 4px 18px rgba(0,0,0,.10);
      text-align:center;
    }
    h2 { margin-top:0; }
    .info {
      text-align:left;
      background:#f7f7f7;
      padding:15px;
      border-radius:10px;
      margin:18px 0;
    }
    .row { margin:8px 0; }
    .label { color:#666; font-size:13px; }
    .value { font-weight:bold; }
    #status { margin-top:18px; font-weight:bold; font-size:17px; }
    .ok { color:#188038; }
    .err { color:#d93025; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🍚 XÁC NHẬN SUẤT ĂN</h2>
    <div id="loading">Đang ghi nhận suất ăn...</div>
    <div id="content" style="display:none">
      <div class="info">
        <div class="row"><div class="label">Họ tên</div><div class="value" id="name"></div></div>
        <div class="row"><div class="label">MSNV</div><div class="value" id="msnv"></div></div>
        <div class="row"><div class="label">Đơn vị</div><div class="value" id="unit"></div></div>
      </div>
      <div id="status"></div>
    </div>
  </div>

<script>
const msnv = <?!= JSON.stringify(msnv) ?>;

function showStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
}

function showEmployee(emp) {
  if (!emp) return;
  document.getElementById('name').textContent = emp.hoTen;
  document.getElementById('msnv').textContent = emp.msnv;
  document.getElementById('unit').textContent = emp.donVi;
}

function showContent(hideInfo) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  if (hideInfo) document.querySelector('.info').style.display = 'none';
}

// Tự động ghi nhận ngay khi trang được mở (sau khi quét QR)
function autoRecord() {
  google.script.run
    .withSuccessHandler(function (res) {
      // Không có thông tin nhân viên (thiếu MSNV / không tìm thấy / hệ thống bận)
      if (!res.employee) {
        showContent(true);
        showStatus('✕ ' + res.message, false);
        return;
      }

      showContent(false);
      showEmployee(res.employee);

      if (res.ok) {
        showStatus('✓ ' + res.message + ' ' + res.time, true);
      } else if (res.duplicate) {
        showStatus('⚠ ' + res.message + ' Lúc ' + res.time + (res.next ? '. Quét lại được sau ' + res.next : ''), false);
      } else {
        showStatus('✕ ' + res.message, false);
      }
    })
    .withFailureHandler(function (err) {
      showContent(true);
      showStatus('Lỗi hệ thống: ' + err.message, false);
    })
    .recordMeal(msnv);
}

autoRecord();
</script>
</body>
</html>
